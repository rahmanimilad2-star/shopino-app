name: Shopino Native Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shopino-release.jks"
          chmod 600 "$RUNNER_TEMP/shopino-release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/shopino-release.jks"
          gradle -p android-native --no-daemon assembleRelease
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: shopino-release-android-apk
          path: android-native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
