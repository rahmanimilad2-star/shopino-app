name: Android Debug APK Build

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Shopino Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Gradle Wrapper integrity
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: Gradle wrapper JAR is missing."
            exit 1
          fi
          ./gradlew --version

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify compiled API origin
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          DEX_DIR="$(mktemp -d)"
          trap 'rm -rf "$DEX_DIR"' EXIT

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK not found or empty: $APK_PATH"
            exit 1
          fi

          unzip -q "$APK_PATH" 'classes*.dex' -d "$DEX_DIR"
          shopt -s nullglob
          DEX_FILES=("$DEX_DIR"/classes*.dex)

          if [ "${#DEX_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No DEX files found in APK."
            exit 1
          fi

          if grep -aEiq 'europe-west3[.]run[.]app' "${DEX_FILES[@]}"; then
            echo "ERROR: APK contains the retired Cloud Run hostname."
            exit 1
          fi

          if ! grep -aFq 'shopino-cloud.ir' "${DEX_FILES[@]}"; then
            echo "ERROR: Production hostname not found in compiled DEX files."
            exit 1
          fi

          echo "API origin check passed."

      - name: Verify APK output exists
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found or empty at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
